variables:
  HEAD:
    description: "Do build using upstream HEAD. Otherwise use version from systemd.spec"
    options: ["head", "no-head"]
    value: "no-head"
  TESTING:
    description: "If 'testing', it does scratch build in tests stage and publishes to testing repo in publish stage"
    options: ["testing", "no-testing"]
    value: "testing"
  PUBLISH:
    description: "Publish result"
    options: ["true", "false"]
    value: "false"

stages:
  - setup

.matrix2:
  parallel:
    matrix:
      - REPO: [main, facebook]
        RELEASE: [9, 10]

.matrix3:
  parallel:
    matrix:
      - REPO: [main, facebook]
        RELEASE: [9, 10]
        HEAD: [ 'head', 'no-head' ]

# setup for merge request
mr:
  stage: setup
  variables:
    TESTING: "testing"
    DO_TEST: "true"
    DO_PUBLISH: "false"
  trigger:
    include: .gitlab-child-ci.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  extends: .matrix3

# setup for nightly builds
ni:
  stage: setup
  variables:
    HEAD: "head"
    TESTING: "testing"
    DO_TEST: "false"
    DO_PUBLISH: "true"
  trigger:
    include: .gitlab-child-ci.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule'
  extends: .matrix2

# setup for manual run
mn:
  stage: setup
  variables:
    # HEAD and TESTING passed from global vars
    DO_TEST: "true"
    DO_PUBLISH: $PUBLISH
  trigger:
    include: .gitlab-child-ci.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == 'web'
  extends: .matrix2
