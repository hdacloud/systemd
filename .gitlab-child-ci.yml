stages:
  - build
  - test
  - publish

workflow:
  name: "systemd-$REPO-$RELEASE-$HEAD"

.fedora:
  image: quay.io/fedora/fedora:latest
  before_script:
    - env # Show variables that were passed to the job
    - test -n "$CENTOS_CERT"
    - test -n "$REPO"; echo "$REPO"
    - test -n "$RELEASE"; echo "$RELEASE"
    - test -n "$HEAD"; echo "$HEAD"
    - test -n "$TESTING"; echo "$TESTING"
    - dnf --quiet install -y tar git-core python3 centos-packager mock mock-centos-sig-configs

systemd:build:
  stage: build
  extends: .fedora
  script:
    - ./releng.py build --cert $CENTOS_CERT --repo $REPO --release $RELEASE --$HEAD --$TESTING
  rules:
    - when: always
  artifacts:
    paths: [ 'artifacts/*-task-id.txt' ]

systemd:test:
  stage: test
  image: quay.io/testing-farm/cli:latest
  dependencies:
    - systemd:build
  before_script:
    - test -n "$REPO"; echo "$REPO"
    - test -n "$RELEASE"; echo "$RELEASE"
    - export TASK_ID_FILE=$(find . -name "*$RELEASE*$REPO*-task-id.txt" -exec echo {} \;); echo "$TASK_ID_FILE"; test -n "$TASK_ID_FILE"
    - export TASK_ID=$(cat $TASK_ID_FILE); echo "$TASK_ID"; test -n "$TASK_ID"
  script:
    - testing-farm request --git-ref $CI_MERGE_REQUEST_REF_PATH --git-url $CI_MERGE_REQUEST_PROJECT_URL --compose 'Fedora-Rawhide'
      --environment REPO=$REPO --environment RELEASE=$RELEASE --environment TASK_ID=$TASK_ID --plan plans/gitlab-ci
  rules:
    - if: $DO_TEST == 'true'

systemd:publish:
  stage: publish
  extends: .fedora
  dependencies:
    - systemd:build
  script:
    - export TASK_ID_FILE=$(find . -name "*$RELEASE*$REPO*-task-id.txt" -exec echo {} \;); echo "$TASK_ID_FILE"; test -n "$TASK_ID_FILE"
    - export TASK_ID=$(cat $TASK_ID_FILE); echo "$TASK_ID"; test -n "$TASK_ID"
    - ./releng.py publish --repo $REPO --release $RELEASE --$TESTING --task-id $TASK_ID
  rules:
    - if: $DO_PUBLISH == 'true'
